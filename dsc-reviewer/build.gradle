plugins {
    id 'java'
    id 'application'
}

group = 'org.materials.dsc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.4'
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dsc.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Regenerate the offline DSC case pack (fixtures only; safe to re-run, deterministic).
tasks.register('generateCase', JavaExec) {
    group = 'dsc'
    description = 'Generates the offline DSC case pack under src/main/resources/cases.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dsc.fixtures.GenerateCasePack'
}
