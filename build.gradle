plugins {
    id 'java'
    id 'application'
}

group = 'dsc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dsc.web.DscApp'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

tasks.register('resolveCheck') {
    description = 'Resolve all dependencies to verify offline/online availability'
    doLast {
        configurations.runtimeClasspath.get().resolve()
        configurations.testRuntimeClasspath.get().resolve()
    }
}
