plugins {
    id 'java'
    id 'application'
}

group = 'org.materialgroup'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.11'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.11'
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.materialgroup.dsc.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

tasks.named('run') {
    standardInput = System.in
}

tasks.register('resolveDependencies') {
    doLast {
        configurations.runtimeClasspath.resolve()
    }
}
