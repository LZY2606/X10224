plugins {
    id 'java'
    id 'application'
}

group = 'dsc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.6.0'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.11'
    implementation 'org.slf4j:slf4j-simple:2.0.20'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dsc.web.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// 离线案例包生成：把确定性构造的案例写成 JSON，随仓库提供，运行时离线读取
tasks.register('generateCasePack', JavaExec) {
    group = 'dsc'
    description = 'Regenerates the bundled offline DSC case pack under src/main/resources/casepack.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dsc.casepack.CasePackGenerator'
}
